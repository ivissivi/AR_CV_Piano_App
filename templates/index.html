<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <title>AR Piano App - Mobile</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js"></script>
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        @media screen and (orientation: portrait) {
            .orientation-warning {
                display: flex;
            }
        }

        .orientation-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 9999;
        }

        .orientation-warning h2 {
            color: #b388ff;
            margin-bottom: 20px;
        }

        .orientation-warning p {
            color: white;
            margin-bottom: 30px;
        }

        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .title {
            display: none; /* Hide the title */
        }
        .mode-select {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .mode-select.hidden {
            display: none;
        }
        .mode-select-content {
            background: rgba(40, 40, 40, 0.9);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .mode-select h2 {
            margin: 0 0 30px 0;
            font-size: 24px;
            color: white;
            text-align: center;
        }
        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .qr-code {
            width: 200px;
            height: 200px;
            background: white;
            padding: 10px;
            border-radius: 10px;
        }
        .qr-instructions {
            color: white;
            font-size: 16px;
            max-width: 300px;
            text-align: center;
            line-height: 1.5;
        }
        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .mode-select .btn {
            width: 250px;
            padding: 20px 30px;
            font-size: 18px;
            border-radius: 15px;
            background: linear-gradient(45deg, #b388ff, #e1bee7);
            border: none;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .mode-select .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .mode-select .btn:active {
            transform: translateY(0);
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        
        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #handCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        
        .piano-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        
        .key-marker {
            position: absolute;
            width: 4px;
            height: 100%;
            background-color: rgba(255, 0, 0, 0.8);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            mix-blend-mode: screen;
        }
        
        .key-label {
            position: absolute;
            color: white;
            font-size: 16px;
            font-weight: bold;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            padding: 4px 8px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            mix-blend-mode: normal;
        }
        
        .key-highlight {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            mix-blend-mode: screen;
            transition: all 0.1s ease;
        }
        
        .key-press-marker {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            mix-blend-mode: screen;
            transition: all 0.1s ease;
        }
        .controls {
            position: fixed;
            bottom: -220px; /* Increased negative value to fully hide the panel */
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            transition: bottom 0.3s ease;
            z-index: 10;
        }
        .controls.open {
            bottom: 0;
        }
        .toggle-controls {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 50px;
            height: 30px;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 11;
            transition: transform 0.3s ease;
        }
        .toggle-controls.open {
            transform: translateX(-50%) rotate(180deg);
        }
        .toggle-controls::after {
            content: '▲';
            color: white;
            font-size: 12px;
        }
        .btn {
            background: linear-gradient(45deg, #b388ff, #e1bee7);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            width: 200px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: linear-gradient(45deg, #666666, #999999);
        }
        .btn.selected {
            background: linear-gradient(45deg, #e1bee7, #b388ff);
            box-shadow: 0 0 10px rgba(177, 136, 255, 0.5);
        }
        .status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 25px;
            background-color: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
            transition: opacity 0.3s;
            opacity: 1;
        }
        .status.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .status.error {
            color: #ff6b6b;
        }
        .status.success {
            color: #4ecdc4;
        }
        .debug {
            position: fixed;
            bottom: 80px;
            left: 10px;
            right: 10px;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            background-color: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            z-index: 100;
        }
        .fullscreen .title,
        .fullscreen .mode-select,
        .fullscreen .debug {
            display: none;
        }
        .fullscreen .video-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        .fullscreen .status {
            opacity: 0;
        }
        .fullscreen .status:hover {
            opacity: 1;
        }
        .hand-tracking {
            display: none; /* Hide the hand tracking indicator */
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .hand-tracking:hover {
            opacity: 1;
        }
        .hand-tracking .status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .hand-tracking .status.detected {
            background-color: #b388ff;
        }
        .hand-tracking .status.not-detected {
            background-color: #e1bee7;
        }
        .camera-select {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
            display: none;
        }
        .camera-select.active {
            display: block;
        }
        .camera-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .camera-option {
            background: rgba(179, 136, 255, 0.2);
            border: 1px solid #b388ff;
            color: white;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .camera-option:hover {
            background: rgba(179, 136, 255, 0.4);
        }
        .camera-option.selected {
            background: rgba(179, 136, 255, 0.6);
        }
        .settings-section {
            width: 100%;
            max-width: 300px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
        }
        .settings-section.active {
            display: block;
        }
        .settings-section h3 {
            margin: 0 0 10px 0;
            color: #b388ff;
            font-size: 16px;
        }
        .settings-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 10px;
        }
        .settings-row label {
            color: #e1bee7;
            font-size: 14px;
        }
        .settings-row select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #b388ff;
            color: white;
            padding: 8px;
            border-radius: 5px;
            font-size: 14px;
            width: 100%;
        }
        .settings-row select:focus {
            outline: none;
            border-color: #e1bee7;
        }
        .settings-row select option {
            background: #1a1a1a;
            color: white;
        }
        .camera-preview {
            width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border: 2px solid #b388ff;
            border-radius: 10px;
            display: none;
        }
        .camera-preview.active {
            display: block;
        }
        @media screen and (orientation: landscape) {
            .video-container {
                width: 100vw;
                height: 100vh;
            }
            
            #videoElement {
                width: 100vw;
                height: 100vh;
            }
            
            #handCanvas {
                width: 100vw;
                height: 100vh;
            }
        }
        .camera-switch, .calibrate-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }

        .calibrate-button {
            top: 80px;  /* Position below camera switch */
        }

        .camera-switch:hover, .calibrate-button:hover {
            transform: scale(1.05);
        }

        .camera-switch:active, .calibrate-button:active {
            transform: scale(0.95);
        }

        .camera-switch svg, .calibrate-button svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        /* Add song selection styles */
        .song-select-button {
            position: fixed;
            top: 140px;  /* Position below calibration button */
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: none; /* Hide by default */
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }

        .song-select-button:hover {
            transform: scale(1.05);
        }

        .song-select-button:active {
            transform: scale(0.95);
        }

        .song-select-button svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .song-select-dropdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            z-index: 1000;
            display: none;
            width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-height: 80vh;
            overflow-y: auto;
        }

        .song-select-dropdown.active {
            display: block;
        }

        .song-select-dropdown h3 {
            color: #b388ff;
            margin: 0 0 20px 0;
            text-align: center;
            font-size: 20px;
        }

        .sort-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .sort-button {
            padding: 8px 12px;
            background: rgba(179, 136, 255, 0.2);
            border: 1px solid rgba(179, 136, 255, 0.4);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sort-button:hover {
            background: rgba(179, 136, 255, 0.3);
        }

        .sort-button.active {
            background: rgba(179, 136, 255, 0.5);
            border-color: rgba(179, 136, 255, 0.8);
        }

        .song-option {
            padding: 15px;
            color: white;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s ease;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
            font-size: 16px;
        }

        .song-option:hover {
            background: rgba(179, 136, 255, 0.3);
            transform: scale(1.02);
        }

        .song-option.selected {
            background: rgba(179, 136, 255, 0.5);
            border-color: rgba(179, 136, 255, 0.8);
        }

        .song-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .song-details {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Remove the old ::before content */
        .song-select-dropdown::before {
            content: none;
        }

        /* Add piano learning mode styles */
        .piano-learning-mode {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
            z-index: 100;
            display: none;
        }

        .piano-learning-mode.active {
            display: block;
        }

        .current-note {
            font-size: 24px;
            font-weight: bold;
            color: #b388ff;
            text-align: center;
            margin-bottom: 10px;
        }

        .note-progress {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .note-progress-bar {
            height: 100%;
            background: #b388ff;
            width: 0%;
            transition: width 0.1s ease;
        }

        .note-feedback {
            text-align: center;
            font-size: 18px;
            margin-top: 10px;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .note-feedback.correct {
            color: #4CAF50;
        }

        .note-feedback.incorrect {
            color: #f44336;
        }

        .key-highlight {
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .key-label {
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* Add this CSS animation at the top of the file in the <style> section */
        @keyframes pulse {
            0% {
                box-shadow: 0 0 15px rgba(78, 205, 196, 0.5);
            }
            50% {
                box-shadow: 0 0 25px rgba(78, 205, 196, 0.8);
            }
            100% {
                box-shadow: 0 0 15px rgba(78, 205, 196, 0.5);
            }
        }
    </style>
</head>
<body>
    <div class="orientation-warning">
        <h2>Please Rotate Your Device</h2>
        <p>This app requires landscape orientation for the best experience.</p>
    </div>
    <div class="container">
        <div id="modeSelect" class="mode-select">
            <div class="mode-select-content">
                <h2>Scan QR code</h2>
                <div class="qr-container">
                    <div id="qrCode" class="qr-code"></div>
                    <p class="qr-instructions">Scan this QR code with your mobile device to connect</p>
                </div>
            </div>
        </div>
        <div class="video-container">
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="handCanvas"></canvas>
            <div id="pianoOverlay" class="piano-overlay"></div>
        </div>
        <div class="hand-tracking">
            <span class="status not-detected"></span>
            <span>Hand Tracking</span>
        </div>
        <div class="toggle-controls" id="toggleControls"></div>
        <div class="controls" id="controls">
            <button id="toggleSettings" class="btn">⚙️ Settings</button>
            <div class="settings-section" id="settingsSection">
                <h3>Camera Settings</h3>
                <div class="settings-row">
                    <label for="cameraDeviceSelect">Select Camera:</label>
                    <select id="cameraDeviceSelect">
                        <option value="">Loading cameras...</option>
                    </select>
                </div>
                <div class="settings-row">
                    <label for="handTrackingMode">Hand Tracking Mode:</label>
                    <select id="handTrackingMode">
                        <option value="single">Single Hand</option>
                        <option value="dual">Dual Hands</option>
                    </select>
                </div>
                <div class="settings-row">
                    <button id="startButton" class="btn" style="width: 100%;">Start Camera</button>
                    <button id="stopButton" class="btn" style="width: 100%;" disabled>Stop Camera</button>
                </div>
                <div class="settings-row">
                    <label for="midiDeviceSelect">Select MIDI Device:</label>
                    <select id="midiDeviceSelect">
                        <option value="">No MIDI devices found</option>
                    </select>
                </div>
            </div>
            <button id="toggleFullscreen" class="btn" disabled>Fullscreen</button>
            <button id="pianoLearningButton" class="btn" disabled>🎹 Start Learning</button>
        </div>
        <div id="status" class="status"></div>
        <div id="playNoteMessage" style="display:none; position:fixed; top:20px; right:20px; z-index:20; background:rgba(40,40,40,0.9); color:#b388ff; font-size:16px; font-weight:bold; padding:12px 24px; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,0.3); pointer-events:none; text-align:right;"></div>
        <div id="debug" class="debug"></div>
        <div class="camera-switch" id="cameraSwitch" title="Switch Camera">
            <img src="/icons/switch_camera.png" alt="Switch Camera" style="width: 24px; height: 24px;">
        </div>
        <div class="calibrate-button" id="calibrateButton" title="Calibrate Piano">
            <img src="/icons/calibration.png" alt="Calibrate Piano" style="width: 24px; height: 24px;">
        </div>
        <div class="song-select-button" id="songSelectButton" title="Select song" onclick="handleSongSelectClick(event)">
            <img src="/icons/music_note.png" alt="Select Song" style="width: 24px; height: 24px;">
        </div>
        <div class="song-select-dropdown" id="songSelectDropdown">
            <!-- Songs will be loaded dynamically -->
        </div>
        <div class="piano-learning-mode" id="pianoLearningMode">
            <div class="current-note" id="currentNote">--</div>
            <div class="note-progress">
                <div class="note-progress-bar" id="noteProgressBar"></div>
    </div>
            <div class="note-feedback" id="noteFeedback"></div>
        </div>
    </div>

    <script>
        const socket = io({
            reconnection: true,
            reconnectionAttempts: 5,
            reconnectionDelay: 1000
        });

        // Function to detect key boundaries by analyzing pixel colors
        function detectKeyBoundaries(x, y) {
            const ctx = handCanvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, handCanvas.width, handCanvas.height);
            const data = imageData.data;
            
            // Function to check if a pixel is white (allowing for more variation)
            function isWhiteKey(r, g, b) {
                const brightness = (r + g + b) / 3;
                // More tolerant white detection
                return brightness > 180 && 
                       Math.abs(r - g) < 50 && 
                       Math.abs(g - b) < 50 && 
                       Math.abs(r - b) < 50;
            }
            
            // Function to check multiple pixels in a vertical line
            function checkVerticalLine(x, y) {
                const samples = 5; // Check multiple points
                let whiteCount = 0;
                for (let i = 0; i < samples; i++) {
                    const sampleY = y + (i - Math.floor(samples/2)) * 10;
                    if (sampleY < 0 || sampleY >= handCanvas.height) continue;
                    
                    const index = (Math.floor(sampleY) * handCanvas.width + Math.floor(x)) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    if (isWhiteKey(r, g, b)) whiteCount++;
                }
                return whiteCount >= Math.floor(samples * 0.6); // 60% must be white
            }
            
            // Start scanning from a point higher up
            y = Math.max(y - 50, 0);
            
            // Find left boundary with vertical line checking
            let leftBound = x;
            let leftStreak = 0;
            while (leftBound > 0) {
                if (!checkVerticalLine(leftBound, y)) {
                    leftStreak++;
                    if (leftStreak > 3) { // Require multiple black pixels to confirm boundary
                        leftBound += 3;
                        break;
                    }
                } else {
                    leftStreak = 0;
                }
                leftBound--;
            }
            
            // Find right boundary with vertical line checking
            let rightBound = x;
            let rightStreak = 0;
            while (rightBound < handCanvas.width) {
                if (!checkVerticalLine(rightBound, y)) {
                    rightStreak++;
                    if (rightStreak > 3) {
                        rightBound -= 3;
                        break;
                    }
                } else {
                    rightStreak = 0;
                }
                rightBound++;
            }
            
            // Find top boundary
            let topBound = y;
            let topStreak = 0;
            while (topBound > 0) {
                const index = (Math.floor(topBound) * handCanvas.width + Math.floor(x)) * 4;
                const r = data[index];
                const g = data[index + 1];
                const b = data[index + 2];
                if (!isWhiteKey(r, g, b)) {
                    topStreak++;
                    if (topStreak > 3) {
                        topBound += 3;
                        break;
                    }
                } else {
                    topStreak = 0;
                }
                topBound--;
            }
            
            // Find bottom boundary
            let bottomBound = y;
            let bottomStreak = 0;
            while (bottomBound < handCanvas.height) {
                const index = (Math.floor(bottomBound) * handCanvas.width + Math.floor(x)) * 4;
                const r = data[index];
                const g = data[index + 1];
                const b = data[index + 2];
                if (!isWhiteKey(r, g, b)) {
                    bottomStreak++;
                    if (bottomStreak > 3) {
                        bottomBound -= 3;
                        break;
                    }
                } else {
                    bottomStreak = 0;
                }
                bottomBound++;
            }
            
            // Ensure minimum key width and height
            const minWidth = 20;
            const minHeight = 100;
            const width = rightBound - leftBound;
            const height = bottomBound - topBound;
            
            if (width < minWidth) {
                const center = (leftBound + rightBound) / 2;
                leftBound = center - minWidth/2;
                rightBound = center + minWidth/2;
            }
            
            if (height < minHeight) {
                const center = (topBound + bottomBound) / 2;
                topBound = center - minHeight/2;
                bottomBound = center + minHeight/2;
            }
            
            return {
                left: leftBound,
                right: rightBound,
                top: topBound,
                bottom: bottomBound
            };
        }

        function drawGuidelines(ctx, width, height) {
            // Clear the canvas first
            ctx.clearRect(0, 0, width, height);
            
            // Draw the video frame
            ctx.drawImage(video, 0, 0, width, height);
            
            // Only draw guidelines if we have calibrated piano keys
            if (pianoKeys && pianoKeys.length > 0) {
                // Draw white keys
                pianoKeys.forEach((key, index) => {
                    const keyWidth = keySpacing * 0.8; // Make key slightly smaller than spacing
                    const keyHeight = height * 0.6;
                    const x = key.x - (keyWidth / 2);
                    const y = key.y - (keyHeight / 2);
                    
                // Draw white key background with improved visibility
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.fillRect(x, y, keyWidth, keyHeight);
                    
                // Draw white key border with improved visibility
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)';
                ctx.lineWidth = 3;
                    ctx.strokeRect(x, y, keyWidth, keyHeight);
            
                    // Draw black keys (if not C, F, or G)
                    const noteName = key.name;
                    if (!noteName.includes('C') && !noteName.includes('F') && !noteName.includes('G')) {
                        const blackKeyWidth = keyWidth * 0.7;
                        
                        // Adjust black key position based on the note
                        let blackX = key.x - (blackKeyWidth / 2);
                        if (noteName.includes('C#')) {
                            // Move C# closer to C
                            blackX = key.x - (blackKeyWidth * 0.9);
                        } else if (noteName.includes('D#')) {
                            // Move D# closer to E
                            blackX = key.x + (blackKeyWidth * 0.3);
                        } else if (noteName.includes('F#')) {
                            // Move F# closer to F
                            blackX = key.x - (blackKeyWidth * 0.9);
                        } else if (noteName.includes('A#')) {
                            // Move A# closer to B
                            blackX = key.x + (blackKeyWidth * 0.3);
                        }
                        // G# stays in the middle
                        
                        const blackY = y;
                        const blackKeyHeight = keyHeight * 0.6;
                        
                        // Draw black key background with improved visibility
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                        ctx.fillRect(blackX, blackY, blackKeyWidth, blackKeyHeight);
                        
                        // Draw black key border with improved visibility
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(blackX, blackY, blackKeyWidth, blackKeyHeight);
                    }
                });
            }
            
            // Draw center crosshair with improved visibility
            const centerX = width / 2;
            const centerY = height / 2;
            const crosshairSize = 40; // Increased size
            
            ctx.strokeStyle = '#FFFF00';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(centerX - crosshairSize, centerY);
            ctx.lineTo(centerX + crosshairSize, centerY);
            ctx.moveTo(centerX, centerY - crosshairSize);
            ctx.lineTo(centerX, centerY + crosshairSize);
            ctx.stroke();
            
            // Draw instructions background with improved visibility
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, width, 150);
            
            const instructions = [
                "ALIGNMENT GUIDE:",
                "1. Position keyboard within the piano keys outline",
                "2. Keep keyboard parallel to the keys",
                "3. Ensure good lighting and focus",
                "4. Position camera directly above keyboard"
            ];
            
            ctx.font = 'bold 24px Arial'; // Increased font size
            ctx.fillStyle = '#FFFF00';
            ctx.fillText(instructions[0], 20, 40);
            
            ctx.font = '20px Arial'; // Increased font size
            ctx.fillStyle = '#FFFFFF';
            for (let i = 1; i < instructions.length; i++) {
                ctx.fillText(instructions[i], 20, 40 + i * 30); // Increased line spacing
            }
        }

        // Add position stabilization
        const POSITION_HISTORY_SIZE = 3;
        const POSITION_THRESHOLD = 0.15; // Increased from 0.1 for more movement tolerance
        let positionHistory = [];

        function stabilizePosition(newPosition) {
            if (!newPosition) return null;
            
            // Add new position to history
            positionHistory.push(newPosition);
            if (positionHistory.length > POSITION_HISTORY_SIZE) {
                positionHistory.shift();
            }
            
            // If we don't have enough history, return the new position
            if (positionHistory.length < 2) return newPosition;
            
            // Calculate average position
            const avgX = positionHistory.reduce((sum, pos) => sum + pos.x, 0) / positionHistory.length;
            const avgY = positionHistory.reduce((sum, pos) => sum + pos.y, 0) / positionHistory.length;
            
            // Check if the new position is within threshold of the average
            const dx = newPosition.x - avgX;
            const dy = newPosition.y - avgY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance > POSITION_THRESHOLD) {
                // If movement is too large, use the average position
                return { x: avgX, y: avgY };
            }
            
            return newPosition;
        }

        function onHandsResults(results) {
            // Update hand tracking status
            const hasHands = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;
            handTrackingStatus.classList.toggle('detected', hasHands);
            handTrackingStatus.classList.toggle('not-detected', !hasHands);

            // Clear the canvas
            handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
            
            if (!hasHands) {
                return;
            }
            
            if (results.multiHandLandmarks) {
                results.multiHandLandmarks.forEach((landmarks, handIndex) => {
                    const handedness = results.multiHandedness[handIndex];
                    const isLeftHand = handedness.label === 'Right';
                    const color = isLeftHand ? '#FF6B6B' : '#4ECDC4';
                    
                    // Stabilize index finger tip position
                    const indexTip = landmarks[8];
                    const stabilizedPosition = stabilizePosition({
                        x: indexTip.x * handCanvas.width,
                        y: indexTip.y * handCanvas.height
                    });
                    
                    // Draw connections between landmarks with improved visibility
                    handCtx.strokeStyle = color;
                    handCtx.lineWidth = 3; // Increased from 2 for better visibility
                    
                    // Draw palm connections
                    const palmIndices = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 9], [9, 13], [13, 17], [0, 17]];
                    palmIndices.forEach(([i, j]) => {
                        handCtx.beginPath();
                        handCtx.moveTo(landmarks[i].x * handCanvas.width, landmarks[i].y * handCanvas.height);
                        handCtx.lineTo(landmarks[j].x * handCanvas.width, landmarks[j].y * handCanvas.height);
                        handCtx.stroke();
                    });
                    
                    // Draw finger connections and points with improved visibility
                    for (let finger = 0; finger < 5; finger++) {
                        const offset = finger * 4 + 1;
                        for (let joint = 0; joint < 3; joint++) {
                            handCtx.beginPath();
                            handCtx.moveTo(
                                landmarks[offset + joint].x * handCanvas.width,
                                landmarks[offset + joint].y * handCanvas.height
                            );
                            handCtx.lineTo(
                                landmarks[offset + joint + 1].x * handCanvas.width,
                                landmarks[offset + joint + 1].y * handCanvas.height
                            );
                            handCtx.stroke();
                            
                            // Draw point at each joint with improved visibility
                            handCtx.beginPath();
                            handCtx.arc(
                                landmarks[offset + joint].x * handCanvas.width,
                                landmarks[offset + joint].y * handCanvas.height,
                                5, // Increased from 4 for better visibility
                                0,
                                2 * Math.PI
                            );
                            handCtx.fillStyle = color;
                            handCtx.fill();
                        }
                        
                        // Draw point at finger tip with improved visibility
                        handCtx.beginPath();
                        handCtx.arc(
                            landmarks[offset + 3].x * handCanvas.width,
                            landmarks[offset + 3].y * handCanvas.height,
                            7, // Increased from 6 for better visibility
                            0,
                            2 * Math.PI
                        );
                        handCtx.fillStyle = color;
                        handCtx.fill();
                    }
                    
                    // Draw point at wrist with improved visibility
                    handCtx.beginPath();
                    handCtx.arc(
                        landmarks[0].x * handCanvas.width,
                        landmarks[0].y * handCanvas.height,
                        6, // Increased from 5 for better visibility
                        0,
                        2 * Math.PI
                    );
                    handCtx.fillStyle = color;
                    handCtx.fill();
                });
            }

            // Send hand data to server if in desktop mode
            if (!isLocalMode) {
                const now = performance.now();
                if (now - lastHandsTime >= HAND_TRACKING_INTERVAL) {
                    socket.emit('hands', {
                        landmarks: results.multiHandLandmarks,
                        handedness: results.multiHandedness
                    });
                    lastHandsTime = now;
                }
            }

            // Buffer the most recent hand tracking results
            handTrackingBuffer.push({
                timestamp: Date.now(),
                results: JSON.parse(JSON.stringify(results)) // Deep copy
            });
            if (handTrackingBuffer.length > HAND_TRACKING_BUFFER_SIZE) {
                handTrackingBuffer.shift();
            }
        }

        function checkPianoKeyPresses(landmarks, isLeftHand) {
            // Get the index finger tip (landmark 8)
            const indexTip = landmarks[8];
            const x = indexTip.x * handCanvas.width;
            const y = indexTip.y * handCanvas.height;
            
            // Check each key for press
            pianoKeys.forEach((key, index) => {
                const keyWidth = keySpacing * 0.8; // Make detection area slightly smaller than key width
                const distance = Math.abs(x - key.x);
                const verticalDistance = Math.abs(y - key.y);
                
                // Check if finger is within the key's bounds
                if (distance < keyWidth / 2 && verticalDistance < keySpacing) {
                    if (!key.isPressed) {
                        // Key is being pressed
                        key.isPressed = true;
                        key.pressedBy = isLeftHand ? 'left' : 'right';
                        
                        // Visual feedback
                        const marker = document.createElement('div');
                        marker.className = 'key-press-marker';
                        marker.style.position = 'absolute';
                        marker.style.left = `${x}px`;
                        marker.style.top = `${y}px`;
                        marker.style.width = '10px';
                        marker.style.height = '10px';
                        marker.style.borderRadius = '50%';
                        marker.style.backgroundColor = isLeftHand ? 'rgba(255, 107, 107, 0.8)' : 'rgba(78, 205, 196, 0.8)';
                        marker.style.boxShadow = '0 0 10px rgba(255, 255, 255, 0.5)';
                        marker.style.zIndex = '20';
                        document.getElementById('pianoOverlay').appendChild(marker);
                        
                        // Remove the marker after a short delay
                        setTimeout(() => marker.remove(), 200);
                    }
                } else if (key.isPressed && key.pressedBy === (isLeftHand ? 'left' : 'right')) {
                        // Key is being released
                        key.isPressed = false;
                        key.pressedBy = null;
                }
            });
        }

        async function getCameraCapabilities(deviceId) {
            try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: deviceId } }
            });
            const track = stream.getVideoTracks()[0];
            const capabilities = track.getCapabilities();
                const settings = track.getSettings();
            stream.getTracks().forEach(track => track.stop());
                return { capabilities, settings };
            } catch (err) {
                console.error('Error getting camera capabilities:', err);
                return null;
            }
        }

        async function enumerateCameras() {
            try {
                // First get camera permission
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(track => track.stop());

                // Get all available cameras
                const devices = await navigator.mediaDevices.enumerateDevices();
                const cameras = devices.filter(device => device.kind === 'videoinput');
                
                // Log all found cameras
                logDebug('Found cameras:');
                cameras.forEach((camera, index) => {
                    logDebug(`Camera ${index + 1}: ID=${camera.deviceId}, Label=${camera.label || 'Unknown'}`);
                });
                
                // Test each camera to get its capabilities
                const cameraInfo = await Promise.all(
                    cameras.map(async (camera) => {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({
                                video: { deviceId: { exact: camera.deviceId } }
                            });
                            const track = stream.getVideoTracks()[0];
                const settings = track.getSettings();
                            const capabilities = track.getCapabilities();
                            stream.getTracks().forEach(track => track.stop());
                            
                            return {
                                deviceId: camera.deviceId,
                                label: camera.label || `Camera ${cameras.indexOf(camera) + 1}`,
                                settings,
                                capabilities
                            };
                        } catch (err) {
                            console.error(`Error testing camera ${camera.deviceId}:`, err);
                            return null;
                        }
                    })
                );

                return cameraInfo.filter(info => info !== null);
            } catch (err) {
                console.error('Error enumerating cameras:', err);
                return [];
            }
        }

                // Automatically select camera 3 if available
                if (availableCameras.length >= 3) {

                    const camera3 = availableCameras[2];
                    const selectedDeviceId = camera3.deviceId;
                    
                    logDebug(`Attempting to start camera 3: ID=${selectedDeviceId}, Label=${camera3.label}`);
                    
                    // Stop any existing stream
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                        currentStream = null;
                    }

                    // Start new stream with explicit constraints
                    try {
                        logDebug('Starting camera 3 with device ID: ' + selectedDeviceId);
                        currentStream = await navigator.mediaDevices.getUserMedia({
                            video: {
                                deviceId: { exact: selectedDeviceId },
                                width: { ideal: MAX_WIDTH },
                                height: { ideal: MAX_HEIGHT }
                            }
                        });

                        // Update main video element
                video.srcObject = currentStream;
                stream = currentStream;

                // Log camera information
                        const track = currentStream.getVideoTracks()[0];
                        const settings = track.getSettings();
                        logDebug(`Initial camera settings: ${JSON.stringify(settings)}`);

                        // Update hand tracking canvas size
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        handCanvas.width = video.videoWidth;
                        handCanvas.height = video.videoHeight;
                        logDebug(`Video ready: ${video.videoWidth}x${video.videoHeight}`);
                        resolve();
                    };
                });

                        // Update the dropdown selection to match
                        cameraSelect.value = selectedDeviceId;
                        logDebug('Camera 3 selected and initialized');

                // Enable controls
                        const startButton = document.getElementById('startButton');
                        const stopButton = document.getElementById('stopButton');
                        const toggleFullscreen = document.getElementById('toggleFullscreen');
                        
                        if (startButton) startButton.style.display = 'none';
                        if (stopButton) stopButton.disabled = false;
                        if (toggleFullscreen) toggleFullscreen.disabled = false;
                        
                videoContainer.classList.add('active');

                // Setup hand tracking
                logDebug('Setting up hand tracking');
                setupHandTracking();
                const mediaPipeCamera = new Camera(video, {
                    onFrame: async () => {
                        const now = performance.now();
                        const timeSinceLastFrame = now - lastHandTrackingTime;
                        
                        // Skip frames if processing is taking too long
                        if (timeSinceLastFrame < HAND_TRACKING_INTERVAL) {
                            return;
                        }
                        
                        // Implement frame skipping if lagging
                        frameSkipCounter++;
                        if (frameSkipCounter >= FRAME_SKIP_THRESHOLD) {
                            frameSkipCounter = 0;
                            return;
                        }
                        
                        if (hands) {

        async function startCamera() {
            try {
                updateStatus('Starting camera...');
                logDebug('=== Starting Camera ===');

                // Get the selected camera device ID
                const cameraSelect = document.getElementById('cameraDeviceSelect');
                if (!cameraSelect) {
                    throw new Error('Camera selection not available');
                }

                const selectedDeviceId = cameraSelect.value;
                
                if (!selectedDeviceId) {
                    await updateCameraList();
                    if (!cameraSelect.value) {
                        throw new Error('No camera available');
                    }
                }

                logDebug(`Selected camera device ID: ${selectedDeviceId}`);

                // Try to start the selected camera
                try {
                    logDebug('Attempting to start selected camera...');
                    currentStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                            deviceId: { exact: selectedDeviceId },
                        width: { ideal: MAX_WIDTH },
                            height: { ideal: MAX_HEIGHT }
                        }
                    });
                    logDebug('Successfully started selected camera');
                } catch (err) {
                    logDebug(`Failed to start selected camera: ${err.message}`);
                    throw err;
                }

                // Update main video element
                video.srcObject = currentStream;
                stream = currentStream;
                video.play();

                // Log the actual camera settings being used
                const track = currentStream.getVideoTracks()[0];
                const settings = track.getSettings();
                logDebug(`Active camera settings: ${JSON.stringify(settings)}`);

                // Enable controls
                const startButton = document.getElementById('startButton');
                const stopButton = document.getElementById('stopButton');
                const toggleFullscreen = document.getElementById('toggleFullscreen');
                
                if (startButton) startButton.style.display = 'none';
                if (stopButton) stopButton.disabled = false;
                if (toggleFullscreen) toggleFullscreen.disabled = false;
                
                videoContainer.classList.add('active');

                // Setup hand tracking with optimized settings
                logDebug('Setting up hand tracking');
                setupHandTracking();
                const mediaPipeCamera = new Camera(video, {
                    onFrame: async () => {
                        const now = performance.now();
                        const timeSinceLastFrame = now - lastHandTrackingTime;
                        
                        // Skip frames if processing is taking too long
                        if (timeSinceLastFrame < HAND_TRACKING_INTERVAL) {
                            return;
                        }
                        
                        // Implement frame skipping if lagging
                        frameSkipCounter++;
                        if (frameSkipCounter >= FRAME_SKIP_THRESHOLD) {
                            frameSkipCounter = 0;
                            return;
                        }
                        
                        if (hands) {
                            try {
                        await hands.send({image: video});
                            } catch (err) {
                                console.error('Hand tracking error:', err);
                            }
                        }
                        lastHandTrackingTime = now;
                    },
                    width: MAX_WIDTH,
                    height: MAX_HEIGHT
                });
                mediaPipeCamera.start();

                // Set canvas size and start frame processing
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        localCanvas.width = video.videoWidth;
                        localCanvas.height = video.videoHeight;
                        handCanvas.width = video.videoWidth;
                        handCanvas.height = video.videoHeight;
                        logDebug(`Video ready: ${video.videoWidth}x${video.videoHeight}`);
                        
                        // Start processing frames in local mode
                        if (isLocalMode) {
                            function processLocalFrame() {
                                if (!isLocalMode || !video.videoWidth) return;
                                
                                localCtx.drawImage(video, 0, 0);
                                drawGuidelines(localCtx, video.videoWidth, video.videoHeight);
                                
                                // Update the video element with the processed frame
                                video.srcObject = null;
                                video.src = localCanvas.toDataURL('image/jpeg');
                                video.play();
                                
                                requestAnimationFrame(processLocalFrame);
                            }
                            
                            processLocalFrame();
                        }
                        
                        resolve();
                    };
                });

                updateStatus('Camera started');
                logDebug('Camera started successfully');

                isStreaming = true;
                frameCount = 0;
                lastFrameTime = performance.now();
                
                if (!isLocalMode) {
                    logDebug('Starting frame sending for desktop mode');
                    requestAnimationFrame(sendFrame);
                }
            } catch (err) {
                console.error('Error starting camera:', err);
                updateStatus('Error starting camera: ' + err.message, true);
                logDebug('Camera error: ' + err.message);
            }
        }

        async function sendFrame(timestamp) {
            if (!stream || !isStreaming || isLocalMode) return;

            try {
                const elapsed = timestamp - lastFrameTime;
                if (elapsed < FRAME_INTERVAL) {
                    requestAnimationFrame(sendFrame);
                    return;
                }

                if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }

                ctx.drawImage(video, 0, 0);
                const frameData = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];
                
                if (socket.connected) {
                    socket.emit('frame', frameData);
                    frameCount++;
                    if (frameCount % TARGET_FPS === 0) {
                        const fps = 1000 / elapsed;
                        logDebug(`FPS: ${fps.toFixed(1)}, Frame size: ${(frameData.length / 1024).toFixed(1)}KB`);
                    }
                }

                lastFrameTime = timestamp;
                if (isStreaming) {
                    requestAnimationFrame(sendFrame);
                }
            } catch (err) {
                console.error('Error sending frame:', err);
                logDebug('Frame error: ' + err.message);
                if (isStreaming) {
                    requestAnimationFrame(sendFrame);
                }
            }
        }

        function checkStability(currentPoint, lastPoint) {
            if (!lastPoint) {
                lastPoint = currentPoint;
                lastPointTime = Date.now();
                return false;
            }
            
            // Calculate distance between current and last point
            const dx = Math.abs(currentPoint.x - lastPoint.x);
            const dy = Math.abs(currentPoint.y - lastPoint.y);
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // Check if point is within stability distance and time threshold
            const timeDiff = Date.now() - lastPointTime;
            const isStable = distance < STABILITY_DISTANCE && timeDiff > STABILITY_TIME;
            
            // Update stability counter and visual feedback
            if (isStable) {
                stabilityCounter++;
                if (Date.now() - lastVisualUpdate >= VISUAL_UPDATE_INTERVAL) {
                    document.getElementById('stabilityIndicator').textContent = 
                        `Thumb stable (${stabilityCounter}/${STABILITY_THRESHOLD})`;
                    document.getElementById('handOrderMessage').textContent = 
                        waitingForRightHand ? 
                        'Keep right thumb steady on C5...' : 
                        'Keep left thumb steady on C4...';
                }
            } else {
                stabilityCounter = Math.max(0, stabilityCounter - 1);
                if (Date.now() - lastVisualUpdate >= VISUAL_UPDATE_INTERVAL) {
                    document.getElementById('stabilityIndicator').textContent = 'Hold thumb still...';
                }
            }
            
            // Check for finger lock
            if (stabilityCounter >= FINGER_LOCK_THRESHOLD && !isFingerLocked) {
                isFingerLocked = true;
                document.getElementById('lockStatus').textContent = 'Thumb locked! Press key now';
                document.getElementById('lockStatus').style.color = '#4ecdc4';
                document.getElementById('handOrderMessage').textContent = 
                    waitingForRightHand ? 
                    'Right thumb locked! Press C5 now' : 
                    'Left thumb locked! Press C4 now';
                updateStatus(waitingForRightHand ? 
                    'Right thumb locked! Press C5 now' : 
                    'Left thumb locked! Press C4 now');
            }
            
            // Update visual feedback
            if (Date.now() - lastVisualUpdate >= VISUAL_UPDATE_INTERVAL) {
            const stabilityBar = document.getElementById('stabilityBar');
            if (stabilityBar) {
                const progress = Math.min(100, (stabilityCounter / STABILITY_THRESHOLD) * 100);
                stabilityBar.style.width = `${progress}%`;
                    stabilityBar.style.backgroundColor = isFingerLocked ? '#00FF00' : '#b388ff';
                }
                lastVisualUpdate = Date.now();
            }
            
            return isStable;
        }

        // Add function to detect key boundaries
        function detectKeyBoundaries(x, y) {
            const ctx = handCanvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, handCanvas.width, handCanvas.height);
            const data = imageData.data;
            
            // Function to check if a pixel is white (allowing for more variation)
            function isWhiteKey(r, g, b) {
                const brightness = (r + g + b) / 3;
                // More tolerant white detection
                return brightness > 180 && 
                       Math.abs(r - g) < 50 && 
                       Math.abs(g - b) < 50 && 
                       Math.abs(r - b) < 50;
            }
            
            // Function to check multiple pixels in a vertical line
            function checkVerticalLine(x, y) {
                const samples = 5; // Check multiple points
                let whiteCount = 0;
                for (let i = 0; i < samples; i++) {
                    const sampleY = y + (i - Math.floor(samples/2)) * 10;
                    if (sampleY < 0 || sampleY >= handCanvas.height) continue;
                    
                    const index = (Math.floor(sampleY) * handCanvas.width + Math.floor(x)) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    if (isWhiteKey(r, g, b)) whiteCount++;
                }
                return whiteCount >= Math.floor(samples * 0.6); // 60% must be white
            }
            
            // Start scanning from a point higher up
            y = Math.max(y - 50, 0);
            
            // Find left boundary with vertical line checking
            let leftBound = x;
            let leftStreak = 0;
            while (leftBound > 0) {
                if (!checkVerticalLine(leftBound, y)) {
                    leftStreak++;
                    if (leftStreak > 3) { // Require multiple black pixels to confirm boundary
                        leftBound += 3;
                        break;
                    }
                } else {
                    leftStreak = 0;
                }
                leftBound--;
            }
            
            // Find right boundary with vertical line checking
            let rightBound = x;
            let rightStreak = 0;
            while (rightBound < handCanvas.width) {
                if (!checkVerticalLine(rightBound, y)) {
                    rightStreak++;
                    if (rightStreak > 3) {
                        rightBound -= 3;
                        break;
                    }
                } else {
                    rightStreak = 0;
                }
                rightBound++;
            }
            
            // Find top boundary
            let topBound = y;
            let topStreak = 0;
            while (topBound > 0) {
                const index = (Math.floor(topBound) * handCanvas.width + Math.floor(x)) * 4;
                const r = data[index];
                const g = data[index + 1];
                const b = data[index + 2];
                if (!isWhiteKey(r, g, b)) {
                    topStreak++;
                    if (topStreak > 3) {
                        topBound += 3;
                        break;
                    }
                } else {
                    topStreak = 0;
                }
                topBound--;
            }
            
            // Find bottom boundary
            let bottomBound = y;
            let bottomStreak = 0;
            while (bottomBound < handCanvas.height) {
                const index = (Math.floor(bottomBound) * handCanvas.width + Math.floor(x)) * 4;
                const r = data[index];
                const g = data[index + 1];
                const b = data[index + 2];
                if (!isWhiteKey(r, g, b)) {
                    bottomStreak++;
                    if (bottomStreak > 3) {
                        bottomBound -= 3;
                        break;
                    }
                } else {
                    bottomStreak = 0;
                }
                bottomBound++;
            }
            
            // Ensure minimum key width and height
            const minWidth = 20;
            const minHeight = 100;
            const width = rightBound - leftBound;
            const height = bottomBound - topBound;
            
            if (width < minWidth) {
                const center = (leftBound + rightBound) / 2;
                leftBound = center - minWidth/2;
                rightBound = center + minWidth/2;
            }
            
            if (height < minHeight) {
                const center = (topBound + bottomBound) / 2;
                topBound = center - minHeight/2;
                bottomBound = center + minHeight/2;
            }
            
            return {
                left: leftBound,
                right: rightBound,
                top: topBound,
                bottom: bottomBound
            };
        }

        function completeCalibration() {
            // Filter for only C4 and C5, and pick leftmost C4 and rightmost C5
            const C4s = calibrationPoints.filter(p => getNoteName(p.note) === 'C4');
            const C5s = calibrationPoints.filter(p => getNoteName(p.note) === 'C5');
            let leftmostC4 = null, rightmostC5 = null;
            if (C4s.length > 0) {
                leftmostC4 = C4s.reduce((min, p) => p.x < min.x ? p : min, C4s[0]);
            }
            if (C5s.length > 0) {
                rightmostC5 = C5s.reduce((max, p) => p.x > max.x ? p : max, C5s[0]);
            }
            if (leftmostC4 && rightmostC5) {
                calibrationPoints = [leftmostC4, rightmostC5];

                // --- Dragging logic (mouse and touch) ---

                    const rect = overlay.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    offset.x = calibrationPoints[draggingIdx].x - (clientX - rect.left);
                    offset.y = calibrationPoints[draggingIdx].y - (clientY - rect.top);
                    document.addEventListener('mousemove', onPointerMove);
                    document.addEventListener('mouseup', onPointerUp);
                    document.addEventListener('touchmove', onPointerMove, {passive: false});
                    document.addEventListener('touchend', onPointerUp);
                    e.preventDefault();

                function onPointerMove(e) {
                    if (draggingIdx === null) return;
                    const rect = overlay.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    let newX = clientX - rect.left + offset.x;
                    let newY = clientY - rect.top + offset.y;
                    // Clamp to overlay bounds
                    newX = Math.max(0, Math.min(overlay.offsetWidth, newX));

                    calibrationPoints[draggingIdx].x = newX;
                    calibrationPoints[draggingIdx].y = newY;
                    updateVisuals();
                    e.preventDefault();
                }
                function onPointerUp(e) {
                    draggingIdx = null;
                    document.removeEventListener('mousemove', onPointerMove);

                    // Remove event listeners
                    overlay.removeEventListener('mousedown', onPointerDown);
                    overlay.removeEventListener('touchstart', onPointerDown);
                    overlay.innerHTML = '';
                    
                    // Calculate key spacing and first key position
                    keySpacing = (calibrationPoints[1].x - calibrationPoints[0].x) / 12; // 12 semitones between C4 and C5
                    firstKeyPosition = calibrationPoints[0].x;
                    
                    // Create piano keys array
                    pianoKeys = [];
                    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                    let currentOctave = 4;
                    let currentNote = 0;
                    
                    // Generate all keys from C4 to C5
                    for (let i = 0; i <= 12; i++) {
                        const x = firstKeyPosition + (i * keySpacing);
                        const note = notes[currentNote];
                        const noteName = `${note}${currentOctave}`;
                        
                        // Adjust black key positions to be closer to their respective white keys
                        let adjustedX = x;
                        if (note.includes('#')) {
                            // For black keys, adjust position based on which white key they're closer to
                            switch(note) {
                                case 'C#':
                                    adjustedX = x - (keySpacing * 0.3);
                                    break;
                                case 'G#':
                                    adjustedX = x; // Keep G# centered
                                    break;
                                case 'A#':
                                    adjustedX = x - (keySpacing * 0.1);
                                    break;
                            }
                        } else {
                            // For white keys, adjust position if needed
                            switch(note) {
                                case 'C':
                                    adjustedX = x + (keySpacing * 0.1);
                                    break;
                                case 'E':
                                    adjustedX = x - (keySpacing * 0.3);
                                    break;
                                case 'F':
                                    adjustedX = x + (keySpacing * 0.3);
                                    break;
                                case 'A':
                                    adjustedX = x - (keySpacing * 0.3);
                                    break;
                                case 'B':
                                    adjustedX = x - (keySpacing * 0.5);
                                    break;
                            }
                        }
                        
                        pianoKeys.push({
                            x: adjustedX,
                            y: calibrationPoints[0].y,
                            name: noteName,
                            isPressed: false,
                            pressedBy: null
                        });
                        
                        currentNote++;
                        if (currentNote >= 12) {
                            currentNote = 0;
                            currentOctave++;
                        }
                    }
                    
                    // Update piano overlay with the new keys
                    updatePianoKeys(pianoKeys);
                    
                    // Save calibration data
                    const calibrationData = {
                        points: calibrationPoints,
                        keySpacing: keySpacing,
                        firstKeyPosition: firstKeyPosition,
                        pianoKeys: pianoKeys
                    };
                    
                    // Store in localStorage
                    localStorage.setItem('pianoCalibration', JSON.stringify(calibrationData));
                    
                    // Emit calibration data to server if in desktop mode

        // Add camera switching functionality
        async function switchCamera() {
            try {
                if (availableCameras.length === 0) {
                    await updateCameraList();
                }
                
                if (availableCameras.length <= 1) {
                    updateStatus('No other cameras available', true);
                    return;
                }
                
                // Increment camera index and wrap around
                currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
                const nextCamera = availableCameras[currentCameraIndex];
                
                // Stop current stream
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }
                
                // Start new stream with next camera
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        deviceId: { exact: nextCamera.deviceId },
                        width: { ideal: MAX_WIDTH },
                        height: { ideal: MAX_HEIGHT }
                    }
                });
                
                // Update video element
                video.srcObject = currentStream;
                stream = currentStream;
                
                // Update camera select dropdown
                const cameraSelect = document.getElementById('cameraDeviceSelect');
                if (cameraSelect) {
                    cameraSelect.value = nextCamera.deviceId;
                }
                
                // Update status
                updateStatus(`Switched to ${nextCamera.label}`);
                logDebug(`Switched to camera: ${nextCamera.label}`);
                
            } catch (err) {
                console.error('Error switching camera:', err);
                updateStatus('Error switching camera: ' + err.message, true);
            }
        }

        function updateMidiStatus(message) {
            const midiStatus = document.getElementById('midiStatus');
            if (midiStatus) {
                midiStatus.textContent = message;
                logDebug('MIDI status updated: ' + message);
            }
        }

        function handleMidiMessage(message) {
            const [status, note, velocity] = message;
            const isNoteOn = (status & 0xF0) === 0x90 && velocity > 0;
            
            if (isNoteOn && isCalibrating) {
                logDebug(`Processing MIDI note: ${note} (velocity: ${velocity})`);
                
                // Check if this is a C note (C4 or C5)
                if (note === MIDI_NOTE_C4 || note === MIDI_NOTE_C5) {
                    logDebug(`C note detected: ${note === MIDI_NOTE_C4 ? 'C4' : 'C5'}`);
                    
                    // Get current hand position - C4 is left hand, C5 is right hand
                    const currentHand = note === MIDI_NOTE_C4 ? 'left' : 'right';
                    const currentPoint = {
                        x: lastPoint ? lastPoint.x : handCanvas.width / 2,
                        y: lastPoint ? lastPoint.y : handCanvas.height / 2,
                        isLeftHand: note === MIDI_NOTE_C4
                    };
                    
                    // Add MIDI calibration point
                    midiCalibrationPoints.push({
                        note,
                        point: currentPoint,
                        hand: currentHand
                    });
                    
                    logDebug(`Added MIDI calibration point for ${currentHand} hand at note ${note}`);
                    
                    // If we have both C4 and C5, complete calibration
                    if (midiCalibrationPoints.length === 2) {
                        logDebug('Both MIDI calibration points collected');
                        completeMidiCalibration();
                    } else if (midiCalibrationPoints.length === 1) {
                        // First point captured, now wait for the other hand
                        waitingForRightHand = !waitingForRightHand;
                        document.getElementById('calibrationStatus').textContent = 
                            waitingForRightHand ? 'Waiting for right hand...' : 'Waiting for left hand...';
                        document.getElementById('handOrderMessage').textContent = 
                            waitingForRightHand ? 'Press C5 on MIDI keyboard for right hand' :
                            'Press C4 on MIDI keyboard for left hand';
                    }
                }
            }
        }

        function completeMidiCalibration() {
            if (midiCalibrationPoints.length === 2) {
                // Sort points by note (C4 first, then C5)
                midiCalibrationPoints.sort((a, b) => a.note - b.note);
                
                // Use MIDI points for calibration
                calibrationPoints = midiCalibrationPoints.map(p => p.point);
                completeCalibration();
                
                // Reset MIDI calibration
                midiCalibrationPoints = [];
                lastMidiNote = null;
            }
        }

                        songs.sort((a, b) => {

                            } else {

                            }
