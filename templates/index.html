        // Add song playback functionality
        let isPlaying = false;
        let highlightedKey = null;

        function highlightKey(note) {
            // Remove previous highlight if exists
            if (highlightedKey) {
                highlightedKey.style.boxShadow = '';
                highlightedKey.style.backgroundColor = '';
            }

            // Find the key element for the current note
            const keyElement = document.querySelector(`[data-key="${note}"]`);
            if (keyElement) {
                keyElement.style.boxShadow = '0 0 20px #4ECDC4';
                keyElement.style.backgroundColor = 'rgba(78, 205, 196, 0.3)';
                highlightedKey = keyElement;
            }
        }

        function playSong(songName) {
            if (!songs[songName]) {
                console.error('Song not found:', songName);
                return;
            }
            
            currentSong = songs[songName];
            isPlaying = true;
            currentNoteIndex = 0;
            
            playNextNote();
        }

        function playNextNote() {
            if (!isPlaying || !currentSong) return;
            
            if (currentNoteIndex >= currentSong.notes.length) {
                isPlaying = false;
                if (highlightedKey) {
                    highlightedKey.style.boxShadow = '';
                    highlightedKey.style.backgroundColor = '';
                    highlightedKey = null;
                }
                return;
            }
            
            const noteData = currentSong.notes[currentNoteIndex];
            if (noteData.note !== "R") {
                // Convert note name to MIDI note number
                const noteName = noteData.note.slice(0, -1);
                const octave = parseInt(noteData.note.slice(-1));
                const noteMap = {
                    "C": 0, "C#": 1, "D": 2, "D#": 3,
                    "E": 4, "F": 5, "F#": 6, "G": 7,
                    "G#": 8, "A": 9, "A#": 10, "B": 11
                };
                const midiNote = noteMap[noteName] + (octave + 1) * 12;
                
                // Highlight the key
                highlightKey(noteData.note);
                
                // Send MIDI note to server
                if (socket.connected) {
                    socket.emit('midi', {
                        status: 0x90, // Note on
                        note: midiNote,
                        velocity: 100
                    });
                    
                    // Send note off after duration
                    setTimeout(() => {
                        socket.emit('midi', {
                            status: 0x80, // Note off
                            note: midiNote,
                            velocity: 0
                        });
                        // Remove highlight after note duration
                        if (highlightedKey) {
                            highlightedKey.style.boxShadow = '';
                            highlightedKey.style.backgroundColor = '';
                            highlightedKey = null;
                        }
                    }, noteData.duration * 1000);
                }
            }
            
            currentNoteIndex++;
            setTimeout(playNextNote, noteData.duration * 1000);
        }

        function stopSong() {
            isPlaying = false;
            currentSong = null;
            currentNoteIndex = 0;
            if (highlightedKey) {
                highlightedKey.style.boxShadow = '';
                highlightedKey.style.backgroundColor = '';
                highlightedKey = null;
            }
        }

        // Remove automatic loading of songs
        // loadAvailableSongs();

        const songSelectButton = document.getElementById('songSelectButton');
        const songSelectDropdown = document.getElementById('songSelectDropdown');

        // Initialize song select button and dropdown
        if (songSelectButton && songSelectDropdown) {
            // Add click event listener for song selection button
            songSelectButton.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                updateStatus('Song select button clicked');
                
                // Toggle dropdown visibility
                const isActive = songSelectDropdown.classList.contains('active');
                songSelectDropdown.classList.toggle('active');
                updateStatus(`Dropdown ${isActive ? 'closed' : 'opened'}`);
                
                // If dropdown is now active, load songs
                if (!isActive) {
                    updateStatus('Loading songs...');
                    loadAvailableSongs();
                }
            });

            // Add click outside handler to close dropdown
            document.addEventListener('click', function(e) {
                if (!songSelectButton.contains(e.target) && !songSelectDropdown.contains(e.target)) {
                    songSelectDropdown.classList.remove('active');
                    updateStatus('Dropdown closed');
                }
            });

            // Make sure the button is visible after calibration
            const showSongSelectButton = function() {
                songSelectButton.style.display = 'flex';
                updateStatus('Song select button is now visible');
            };

            // Add the showSongSelectButton function to the global scope
            window.showSongSelectButton = showSongSelectButton;
        } else {
            console.error('Song select elements not found');
            updateStatus('Error: Song selection elements not found', true);
        }

        // Function to load available songs
        async function loadAvailableSongs() {
            const status = document.getElementById('status');
            status.textContent = 'Loading songs...';
            
            try {
                const response = await fetch('/get_songs');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const songs = await response.json();
                status.textContent = `Found ${songs.length} songs`;
                
                const dropdown = document.getElementById('songSelectDropdown');
                if (!dropdown) {
                    throw new Error('Song selection dropdown not found');
                }
                
                // Add sorting controls
                dropdown.innerHTML = `
                    <h3>Select a song</h3>
                    <div class="sort-controls">
                        <button class="sort-button" data-sort="title">Title</button>
                        <button class="sort-button" data-sort="difficulty">Difficulty</button>
                        <button class="sort-button" data-sort="tempo">Tempo</button>
                    </div>
                `;

                // Add click handlers for sort buttons
                const sortButtons = dropdown.querySelectorAll('.sort-button');
                sortButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        // Remove active class from all buttons
                        sortButtons.forEach(btn => btn.classList.remove('active'));
                        // Add active class to clicked button
                        button.classList.add('active');
                        // Sort songs
                        const sortBy = button.dataset.sort;
                        songs.sort((a, b) => {
                            if (sortBy === 'title') {
                                return a.title.localeCompare(b.title);
                            } else {
                                return a[sortBy] - b[sortBy];
                            }
                        });
                        // Update display
                        displaySongs(songs);
                    });
                });
                
                // Initial display of songs
                displaySongs(songs);
                
                status.textContent = 'Songs loaded successfully';
            } catch (err) {
                status.textContent = 'Error loading songs: ' + err.message;
                status.className = 'status error';
            }
        }

        // Function to display songs
        function displaySongs(songs) {
            const dropdown = document.getElementById('songSelectDropdown');
            const songsContainer = document.createElement('div');
            
            songs.forEach(song => {
                const option = document.createElement('div');
                option.className = 'song-option';
                option.innerHTML = `
                    <div class="song-title">${song.title}</div>
                    <div class="song-details">
                        Difficulty: ${song.difficulty} | Tempo: ${song.tempo} BPM | Time: ${song.time_signature} | Key: ${song.key}
                    </div>
                `;
                option.onclick = () => {
                    const status = document.getElementById('status');
                    status.textContent = `Loading ${song.title}...`;
                    selectSong(song);
                    dropdown.classList.remove('active');
                };
                songsContainer.appendChild(option);
            });
            
            // Replace existing songs with new sorted list
            const existingSongs = dropdown.querySelector('.sort-controls').nextSibling;
            if (existingSongs) {
                existingSongs.remove();
            }
            dropdown.appendChild(songsContainer);
        }

        // Add this at the start of your script section
        function handleSongSelectClick(event) {
            event.preventDefault();
            event.stopPropagation();
            
            // Force a visual change to confirm click
            const button = document.getElementById('songSelectButton');
            button.style.backgroundColor = 'rgba(255, 0, 0, 0.5)';
            setTimeout(() => {
                button.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
            }, 200);
            
            // Show immediate feedback
            const status = document.getElementById('status');
            status.textContent = 'Button clicked!';
            status.style.display = 'block';
            status.style.opacity = '1';
            
            // Toggle dropdown
            const dropdown = document.getElementById('songSelectDropdown');
            dropdown.classList.toggle('active');
            
            // Load songs if dropdown is now active
            if (dropdown.classList.contains('active')) {
                loadAvailableSongs();
            }
        }
    </script>
</body>
